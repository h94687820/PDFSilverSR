kind = "mobile"
previewPath = "/"
title = "PDFSilverSR"
description = "An offline-first native mobile PDF and notebook workspace for importing, reading, organizing, and editing documents locally with smooth large-file navigation and focused notebook pages."
version = "1.0.0"
id = "artifacts/pdfsilversr"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24305

[services.development]
run = "pnpm --filter @workspace/pdfsilversr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pdfsilversr", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pdfsilversr", "run", "serve" ]

[services.env]
PORT = "24305"
BASE_PATH = "/"
